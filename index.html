<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>段奕宏 好き顔9選</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 首页 -->
  <section id="start-screen" class="screen active">
    <div class="start-content">
      <div class="title-cn">段奕宏</div>
      <div class="title-jp">好き顔9選</div>

      <button id="start-btn">START</button>
    </div>
  </section>


  <!-- 游戏页面 -->
  <section id="game-screen" class="screen">

    <div class="game-header">
      <div id="round-title">ROUND 1</div>
      <div id="round-subtitle"></div>
      <div class="progress-wrap">
        <div id="progress-bar"></div>
      </div>
    </div>

    <div id="instruction"></div>

    <div id="group-container"></div>

  </section>


  <!-- 最终排名 -->
  <section id="result-screen" class="screen">

    <div class="result-title">
      <div class="result-cn">段奕宏</div>
      <div class="result-jp">好き顔9選</div>
    </div>

    <div id="result-grid"></div>

    <button id="again-btn">AGAIN</button>

  </section>


  <script src="data.js"></script>
  <script src="script.js"></script>

</body>
</html>
