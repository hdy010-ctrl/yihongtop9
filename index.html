<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>TOP 9</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==================== 开始页 ==================== -->

    <section id="startScreen" class="screen start-screen">

        <div class="start-content">

            <div class="small-title">
                PERSONAL RANKING
            </div>

            <h1>TOP 9</h1>

            <div class="line"></div>

            <p>
                59 CHARACTERS
                <br>
                ONE CHOICE EACH ROUND
            </p>

            <button id="startButton">
                START
            </button>

        </div>

    </section>


    <!-- ==================== 游戏页 ==================== -->

    <section id="gameScreen" class="screen game-screen hidden">

        <header class="game-header">

            <div>

                <div id="roundName">
                    ROUND 1
                </div>

                <div id="roundDescription">
                    淘汰赛
                </div>

            </div>


            <div class="counter">

                <span id="groupCurrent">
                    1
                </span>

                <span class="slash">
                    /
                </span>

                <span id="groupTotal">
                    30
                </span>

            </div>

        </header>


        <div class="progress-bar">

            <div id="progressFill"></div>

        </div>


        <main>

            <div class="instruction">
                请选择你更喜欢的一张
            </div>

            <div
                id="groupContainer"
                class="group-container"
            >
            </div>

        </main>

    </section>


    <!-- ==================== TOP 9 ==================== -->

    <section
        id="resultScreen"
        class="screen result-screen hidden"
    >

        <div class="result-title">

            <div class="small-title">
                FINAL RESULT
            </div>

            <h1>TOP 9</h1>

        </div>


        <div
            id="resultContainer"
            class="result-container"
        >
        </div>


        <button
            id="againButton"
            class="again-button"
        >
            AGAIN
        </button>

    </section>


    <!-- 非常重要：data.js 必须在 script.js 前面 -->

    <script src="data.js"></script>
    <script src="script.js"></script>

</body>

</html>
